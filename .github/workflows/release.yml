name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  check_version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/yo/Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crates/yo/Cargo.toml version ${version}"
            exit 1
          fi
      - name: Check that the changelog has entries for this version
        run: script/changelog-section "${GITHUB_REF_NAME#v}" >/dev/null

  bundle_mac:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    # Intel builds are cross-compiled on the Apple Silicon runner.
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        run: brew install lld
      - name: Use the stable release channel
        run: echo stable > crates/yo/RELEASE_CHANNEL
      # With MACOS_CERTIFICATE alone the bundle is signed but not notarized.
      # Without it the bundle is ad-hoc signed.
      - name: Prepare provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            profile_path="$RUNNER_TEMP/embedded.provisionprofile"
            echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
            echo "MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
          fi
      - name: Bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: script/bundle-mac ${{ matrix.arch }}-apple-darwin
      - name: Check that every string and command has its Chinese text
        if: matrix.arch == 'aarch64'
        run: script/check-translations --binary target/aarch64-apple-darwin/release/yo
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.arch }}-apple-darwin/release/Yo-${{ matrix.arch }}.dmg
            target/yo-remote-server-macos-${{ matrix.arch }}.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-dsym
          path: target/${{ matrix.arch }}-apple-darwin/release/Yo.dSYM.zip
          if-no-files-found: error

  bundle_linux:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: echo stable > crates/yo/RELEASE_CHANNEL
      - name: Bundle
        run: ./script/bundle-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/yo-linux-${{ matrix.arch }}.tar.gz
            target/yo-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error

  bundle_windows:
    needs: check_version
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: Set-Content -Path crates/yo/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Bundle
        run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            target/Yo-x86_64.exe
            target/yo-remote-server-windows-x86_64.gz
          if-no-files-found: error

  release:
    needs: [bundle_mac, bundle_linux, bundle_windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch tags for the changelog link
        run: git fetch --quiet --tags --force --depth=1 origin
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Keep debug symbols out of the release assets
        run: find artifacts -name '*.dSYM.zip' -delete
      - name: Write the release body
        run: |
          {
            cat .github/release/body.md
            echo
            echo "## What's new"
            echo
            script/changelog-section "${GITHUB_REF_NAME#v}"
            previous=$(git tag --sort=-v:refname | grep -A1 -x "${GITHUB_REF_NAME}" | tail -n +2)
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-body.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: artifacts/**

  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Download macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Yo-aarch64.dmg" \
            --pattern "Yo-x86_64.dmg" \
            --dir release-assets

          for asset in Yo-aarch64.dmg Yo-x86_64.dmg; do
            if [ ! -f "release-assets/${asset}" ]; then
              echo "Missing release asset: ${asset}"
              ls -lh release-assets
              exit 1
            fi
          done

      - name: Compute checksums
        id: checksums
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          echo "arm_sha256=$(sha256sum release-assets/Yo-aarch64.dmg | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "intel_sha256=$(sha256sum release-assets/Yo-x86_64.dmg | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: magalab/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Yo cask
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/yo.rb <<'RUBY'
          cask "yo" do
            arch arm: "aarch64", intel: "x86_64"

            version "__VERSION__"
            sha256 arm:   "__ARM_SHA256__",
                   intel: "__INTEL_SHA256__"

            url "https://github.com/magalab/yo/releases/download/v#{version}/Yo-#{arch}.dmg"
            name "Yo"
            desc "Native code editor with built-in coding agents"
            homepage "https://github.com/magalab/yo"

            depends_on :macos

            app "Yo.app"
            binary "/Applications/Yo.app/Contents/MacOS/cli", target: "yo"
          end
          RUBY

          sed -i \
            -e "s/__VERSION__/${{ steps.checksums.outputs.version }}/g" \
            -e "s/__ARM_SHA256__/${{ steps.checksums.outputs.arm_sha256 }}/g" \
            -e "s/__INTEL_SHA256__/${{ steps.checksums.outputs.intel_sha256 }}/g" \
            tap/Casks/yo.rb

      - name: Commit and push cask
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/yo.rb
          if git diff --cached --quiet; then
            echo "Yo cask is already up to date"
            exit 0
          fi
          git commit -m "yo ${GITHUB_REF_NAME}"
          git push
